AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: recipe-book — API (Lambda Function URL), Cognito auth, S3 photos

Parameters:
  DbUrl:
    Type: String
    Description: Turso libsql:// URL
  DbAuthToken:
    Type: String
    NoEcho: true
    Description: Turso auth token
  ExternalApiSecret:
    Type: String
    NoEcho: true
    Description: Bearer secret for the /api/external importer surface
  WebOrigin:
    Type: String
    Default: ''
    Description: Deployed web origin allowed by CORS (the Amplify URL)
  WebAuthnRpId:
    Type: String
    Default: localhost
    Description: Passkey relying-party ID (the web app's bare domain; CI derives it from WebOrigin)
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Anthropic API key for recipe import extraction (empty disables it)
  AdminUsernames:
    Type: String
    Default: ''
    Description: Comma-separated Cognito usernames allowed to invite new accounts from the app

Resources:
  Api:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      # Extraction budgets 50s of model time (src/extract.ts); the rest is
      # headroom for cold start and database round trips.
      Timeout: 90
      # CORS stays unset here on purpose: Express handles it. Both set would
      # emit duplicate headers and browsers reject the response.
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          NODE_ENV: production
          DB_URL: !Ref DbUrl
          DB_AUTH_TOKEN: !Ref DbAuthToken
          EXTERNAL_API_SECRET: !Ref ExternalApiSecret
          WEB_ORIGIN: !Ref WebOrigin
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          S3_BUCKET: !Ref PhotosBucket
          ADMIN_USERNAMES: !Ref AdminUsernames
      Policies:
        - S3WritePolicy:
            BucketName: !Ref PhotosBucket
        # Invites from the app create accounts the way scripts/add-user.sh does,
        # Settings lists them, and each person's chosen username is read and
        # written as their preferred_username attribute.
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:ListUsers
              Resource: !GetAtt UserPool.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: node22
        EntryPoints:
          - src/lambda.ts

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: recipe-book-users
      # Essentials unlocks choice-based sign-in (passkeys + email OTP).
      UserPoolTier: ESSENTIALS
      WebAuthnRelyingPartyID: !Ref WebAuthnRpId
      WebAuthnUserVerification: required
      # Accounts are created by an admin (Settings → Invite in the app, or
      # scripts/add-user.sh); nobody can sign up.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      # No self-service password reset: nothing can convert email access
      # into a working password. Recovery = email-OTP sign-in or admin CLI.
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      Policies:
        SignInPolicy:
          # AWS refuses to drop PASSWORD from this list; the app client has
          # no password flow and recovery is admin-only, so it stays inert.
          AllowedFirstAuthFactors: [PASSWORD, WEB_AUTHN, EMAIL_OTP]
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      # No secret: the browser calls InitiateAuth directly.
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # A device stays signed in for a year; renewal is one biometric tap.
      RefreshTokenValidity: 365
      TokenValidityUnits:
        RefreshToken: days

  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        # The bucket policy below is the intended public-read path.
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          # Presigned PUTs come from the browser; the URL signature is the
          # credential, so a wildcard origin is fine here.
          - AllowedMethods: [PUT]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
          - AllowedMethods: [GET]
            AllowedOrigins: ['*']

  PhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotosBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${PhotosBucket.Arn}/photos/*'

Outputs:
  ApiUrl:
    Description: Lambda Function URL (VITE_API_BASE_URL, without trailing slash)
    Value: !GetAtt ApiUrl.FunctionUrl
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Description: VITE_COGNITO_CLIENT_ID
    Value: !Ref UserPoolClient
  PhotosBucketName:
    Value: !Ref PhotosBucket
